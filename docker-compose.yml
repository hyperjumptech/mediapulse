version: "3"

services:
  postgres:
    image: postgres:13-alpine
    ports:
      - 5432:5432
    environment:
      POSTGRES_PASSWORD: mediapulse
      POSTGRES_USER: mediapulse
      POSTGRES_DB: mediapulse
    volumes:
      - ./data:/var/lib/postgresql/data
    restart: unless-stopped

  # Next.js apps
  hermes:
    build:
      context: .
      dockerfile: apps/hermes/Dockerfile
    ports:
      - 3001:3001
    env_file:
      - packages/env/.env
      - packages/env/.env.local
    environment:
      DATABASE_URL: postgresql://mediapulse:mediapulse@postgres:5432/mediapulse?schema=public
    depends_on:
      - postgres
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    ports:
      - 3000:3000
    env_file:
      - packages/env/.env
      - packages/env/.env.local
    environment:
      DATABASE_URL: postgresql://mediapulse:mediapulse@postgres:5432/mediapulse?schema=public
    depends_on:
      - postgres
    restart: unless-stopped

  # Agent APIs (Hono/Bun)
  agent-auth-api:
    build:
      context: .
      dockerfile: apps/agent-auth-api/Dockerfile
    ports:
      - 8080:8080
    env_file:
      - packages/env/.env
      - packages/env/.env.local
    environment:
      DATABASE_URL: postgresql://mediapulse:mediapulse@postgres:5432/mediapulse?schema=public
    depends_on:
      - postgres
    restart: unless-stopped

  agent-data-api:
    build:
      context: .
      dockerfile: apps/agent-data-api/Dockerfile
    ports:
      - 8081:8081
    env_file:
      - packages/env/.env
      - packages/env/.env.local
    environment:
      DATABASE_URL: postgresql://mediapulse:mediapulse@postgres:5432/mediapulse?schema=public
    depends_on:
      - postgres
      - agent-auth-api
    restart: unless-stopped

  agent-registry-api:
    build:
      context: .
      dockerfile: apps/agent-registry-api/Dockerfile
    ports:
      - 8082:8082
    env_file:
      - packages/env/.env
      - packages/env/.env.local
    environment:
      DATABASE_URL: postgresql://mediapulse:mediapulse@postgres:5432/mediapulse?schema=public
    depends_on:
      - postgres
    restart: unless-stopped

  # Agent runtimes (Hono/Bun)
  agent-data-collection:
    build:
      context: .
      dockerfile: apps/agents/data-collection/Dockerfile
    ports:
      - 4001:4001
    env_file:
      - packages/env/.env
      - packages/env/.env.local
    depends_on:
      - agent-auth-api
      - agent-data-api
    restart: unless-stopped

  agent-content-generation:
    build:
      context: .
      dockerfile: apps/agents/content-generation/Dockerfile
    ports:
      - 4002:4002
    env_file:
      - packages/env/.env
      - packages/env/.env.local
    depends_on:
      - agent-auth-api
      - agent-data-api
    restart: unless-stopped

  agent-delivery:
    build:
      context: .
      dockerfile: apps/agents/delivery/Dockerfile
    ports:
      - 4003:4003
    env_file:
      - packages/env/.env
      - packages/env/.env.local
    depends_on:
      - agent-auth-api
      - agent-data-api
    restart: unless-stopped

  # Worker (no HTTP port)
  hermes-worker:
    build:
      context: .
      dockerfile: apps/hermes-worker/Dockerfile
    env_file:
      - packages/env/.env
      - packages/env/.env.local
    environment:
      # In Docker, DB is reachable by service name, not localhost
      DATABASE_URL: postgresql://mediapulse:mediapulse@postgres:5432/mediapulse?schema=public
      PG_DATAQUEUE_DATABASE: postgresql://mediapulse:mediapulse@postgres:5432/mediapulse?schema=dataqueue&search_path=dataqueue
    depends_on:
      - postgres
    restart: unless-stopped
