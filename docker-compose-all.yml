# This docker-compose file is used to start the non-development apps and the database.
version: "3"

services:
  postgres:
    image: postgres:13-alpine
    ports:
      - 5432:5432
    environment:
      # Official image: POSTGRES_USER is the cluster superuser (full DDL, CREATE DATABASE, etc.).
      POSTGRES_PASSWORD: mediapulse
      POSTGRES_USER: mediapulse
      POSTGRES_DB: mediapulse
    volumes:
      - ./data:/var/lib/postgresql/data
      - ./docker/postgres/initdb/01-prisma-dev.sql:/docker-entrypoint-initdb.d/01-prisma-dev.sql
    restart: unless-stopped

  # Next.js apps
  hermes:
    build:
      context: .
      dockerfile: apps/hermes/Dockerfile
    ports:
      - 3001:3001
    env_file:
      - packages/hermes/env/.env
    environment:
      ORCHESTRATION_DATABASE_URL: postgresql://mediapulse:mediapulse@postgres:5432/mediapulse?schema=orchestration
    depends_on:
      - postgres
    restart: unless-stopped

  user-registration:
    build:
      context: .
      dockerfile: apps/mediapulse/user-registration/Dockerfile
    ports:
      - 3002:3002
    env_file:
      - packages/mediapulse/env/.env
    environment:
      MEDIAPULSE_DATABASE_URL: postgresql://mediapulse:mediapulse@postgres:5432/mediapulse?schema=mediapulse
    depends_on:
      - postgres
    restart: unless-stopped

  # Agent APIs (Hono/Bun)
  agent-auth-api:
    build:
      context: .
      dockerfile: apps/hermes/agent-auth-api/Dockerfile
    ports:
      - 8080:8080
    env_file:
      - packages/hermes/env/.env
    environment:
      ORCHESTRATION_DATABASE_URL: postgresql://mediapulse:mediapulse@postgres:5432/mediapulse?schema=orchestration
    depends_on:
      - postgres
    restart: unless-stopped

  agent-data-api:
    build:
      context: .
      dockerfile: apps/mediapulse/agent-data-api/Dockerfile
    ports:
      - 8081:8081
    env_file:
      - packages/mediapulse/env/.env
    environment:
      MEDIAPULSE_DATABASE_URL: postgresql://mediapulse:mediapulse@postgres:5432/mediapulse?schema=mediapulse
    depends_on:
      - postgres
      - agent-auth-api
    restart: unless-stopped

  agent-registry-api:
    build:
      context: .
      dockerfile: apps/hermes/agent-registry-api/Dockerfile
    ports:
      - 8082:8082
    env_file:
      - packages/hermes/env/.env
    environment:
      ORCHESTRATION_DATABASE_URL: postgresql://mediapulse:mediapulse@postgres:5432/mediapulse?schema=orchestration
    depends_on:
      - postgres
    restart: unless-stopped

  # Agent runtimes (Hono/Bun)
  agent-data-collection:
    build:
      context: .
      dockerfile: apps/mediapulse/agents/data-collection/Dockerfile
    ports:
      - 4001:4001
    env_file:
      - packages/mediapulse/env/.env
    depends_on:
      - agent-auth-api
      - agent-data-api
    restart: unless-stopped

  agent-page-collection:
    build:
      context: .
      dockerfile: apps/mediapulse/agents/page-collection/Dockerfile
    ports:
      - 4006:4006
    env_file:
      - packages/mediapulse/env/.env
    depends_on:
      - agent-auth-api
      - agent-data-api
    restart: unless-stopped

  agent-content-generation:
    build:
      context: .
      dockerfile: apps/mediapulse/agents/content-generation/Dockerfile
    ports:
      - 4002:4002
    env_file:
      - packages/mediapulse/env/.env
    depends_on:
      - agent-auth-api
      - agent-data-api
    restart: unless-stopped

  agent-delivery:
    build:
      context: .
      dockerfile: apps/mediapulse/agents/delivery/Dockerfile
    ports:
      - 4003:4003
    env_file:
      - packages/mediapulse/env/.env
    depends_on:
      - agent-auth-api
      - agent-data-api
    restart: unless-stopped

  agent-newsletter-feedback:
    build:
      context: .
      dockerfile: apps/mediapulse/agents/newsletter-feedback/Dockerfile
    ports:
      - 4012:4012
    env_file:
      - packages/mediapulse/env/.env
    depends_on:
      - agent-auth-api
      - agent-data-api
    restart: unless-stopped

  # Worker (no HTTP port)
  hermes-worker:
    build:
      context: .
      dockerfile: apps/hermes/worker/Dockerfile
    env_file:
      - packages/hermes/env/.env
    environment:
      # In Docker, DB is reachable by service name, not localhost
      ORCHESTRATION_DATABASE_URL: postgresql://mediapulse:mediapulse@postgres:5432/mediapulse?schema=orchestration
      PG_DATAQUEUE_DATABASE: postgresql://mediapulse:mediapulse@postgres:5432/mediapulse?schema=dataqueue&search_path=dataqueue
    depends_on:
      - postgres
    restart: unless-stopped
