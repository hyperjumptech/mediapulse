name: Remote deploy
description: Connect to the deploy VPN once and trigger the deploy webhook for every service in a deploy matrix.

inputs:
  services-json:
    description: >-
      Deploy matrix JSON ([{ "service", "webhook_env" }, ...]). Each entry's webhook URL is read from
      the environment variable named by `webhook_env`, so the calling job must expose those URLs as env.
    required: true
  webhook-token:
    description: Bearer token for the deploy webhooks.
    required: true
  vpn-config-b64:
    description: Base64-encoded VPN client configuration.
    required: true
  vpn-password:
    description: VPN key passphrase.
    required: true

runs:
  using: composite
  steps:
    - name: Trigger deployments
      shell: bash
      env:
        SERVICES_JSON: ${{ inputs.services-json }}
        DEPLOY_WEBHOOK_TOKEN: ${{ inputs.webhook-token }}
        OPENVPN_CONFIG_B64: ${{ inputs.vpn-config-b64 }}
        OPENVPN_PASSWORD: ${{ inputs.vpn-password }}
      run: bash "$GITHUB_WORKSPACE/.github/scripts/trigger-deploy-webhooks.sh"
