name: Cursor rules review (deterministic)

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  changes:
    name: Detect whether review should run
    runs-on: ubuntu-latest
    outputs:
      run_cursor_review: ${{ steps.detect.outputs.run_cursor_review }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Detect PR change scope
        id: detect
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/detect-pr-changes.mjs --base "$PR_BASE_SHA" --head "$PR_HEAD_SHA"

  cursor-review:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_cursor_review == 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Run cursor PR review
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/cursor-pr-review.mjs --base "$BASE_SHA" --head "$HEAD_SHA"
