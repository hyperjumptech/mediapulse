name: Cursor rules review (deterministic)

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  cursor-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run cursor PR review
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/cursor-pr-review.mjs --base "$BASE_SHA" --head "$HEAD_SHA"
