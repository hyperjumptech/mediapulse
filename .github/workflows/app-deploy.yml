name: App Deployment

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  db-ready:
    runs-on: ubuntu-latest
    env:
      ORCHESTRATION_DATABASE_URL: ${{ secrets.ORCHESTRATION_DATABASE_URL }}
      MEDIAPULSE_DATABASE_URL: ${{ secrets.MEDIAPULSE_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wait for orchestration DB
        run: |
          for i in {1..24}; do
            pnpm --filter=@hermes/orchestration-database exec prisma db execute --stdin <<< "SELECT 1;" && exit 0
            echo "Waiting for orchestration DB ($i/24)..."
            sleep 5
          done
          echo "Orchestration DB did not become ready in time"
          exit 1

      - name: Wait for mediapulse DB
        run: |
          for i in {1..24}; do
            pnpm --filter=@mediapulse/database exec prisma db execute --stdin <<< "SELECT 1;" && exit 0
            echo "Waiting for mediapulse DB ($i/24)..."
            sleep 5
          done
          echo "Mediapulse DB did not become ready in time"
          exit 1

  db-migrate:
    name: Apply Prisma migrations (production DBs)
    runs-on: ubuntu-latest
    needs: db-ready
    concurrency:
      group: prisma-migrate-production
      cancel-in-progress: false
    env:
      ORCHESTRATION_DATABASE_URL: ${{ secrets.ORCHESTRATION_DATABASE_URL }}
      MEDIAPULSE_DATABASE_URL: ${{ secrets.MEDIAPULSE_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migrate deploy (orchestration)
        run: pnpm --filter=@hermes/orchestration-database run db:migrate:deploy

      - name: Migrate deploy (mediapulse)
        run: pnpm --filter=@mediapulse/database run db:migrate:deploy

  publish:
    name: Publish ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: db-migrate
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: agent-auth-api
            dockerfile: apps/hermes/agent-auth-api/Dockerfile
            image: agent-auth-api
          - service: agent-data-api
            dockerfile: apps/mediapulse/agent-data-api/Dockerfile
            image: agent-data-api
          - service: domain-api
            dockerfile: apps/mediapulse/domain-api/Dockerfile
            image: domain-api
          - service: agent-registry-api
            dockerfile: apps/hermes/agent-registry-api/Dockerfile
            image: agent-registry-api
          - service: user-registration
            dockerfile: apps/mediapulse/user-registration/Dockerfile
            image: user-registration
          - service: hermes
            dockerfile: apps/hermes/dashboard/Dockerfile
            image: hermes
          - service: hermes-worker
            dockerfile: apps/hermes/worker/Dockerfile
            image: hermes-worker
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:sha-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy ${{ matrix.service }} via Coolify
    runs-on: ubuntu-latest
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: agent-auth-api
            webhook_secret: COOLIFY_WEBHOOK_APP_AGENT_AUTH_API
          - service: agent-data-api
            webhook_secret: COOLIFY_WEBHOOK_APP_AGENT_DATA_API
          - service: domain-api
            webhook_secret: COOLIFY_WEBHOOK_APP_DOMAIN_API
          - service: agent-registry-api
            webhook_secret: COOLIFY_WEBHOOK_APP_AGENT_REGISTRY_API
          - service: user-registration
            webhook_secret: COOLIFY_WEBHOOK_APP_USER_REGISTRATION
          - service: hermes
            webhook_secret: COOLIFY_WEBHOOK_APP_HERMES
          - service: hermes-worker
            webhook_secret: COOLIFY_WEBHOOK_APP_HERMES_WORKER
    steps:
      - name: Trigger Coolify deployment
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets[matrix.webhook_secret] }}
        run: curl --fail --silent --show-error -X GET "$COOLIFY_WEBHOOK_URL"

  cleanup:
    name: Prune old GHCR versions (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - agent-auth-api
          - agent-data-api
          - domain-api
          - agent-registry-api
          - user-registration
          - hermes
          - hermes-worker
    steps:
      - uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ matrix.image }}
          package-type: container
          min-versions-to-keep: 2
          token: ${{ secrets.GITHUB_TOKEN }}
