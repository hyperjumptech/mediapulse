name: App Deployment

on:
  push:
    branches:
      - main

jobs:
  db-ready:
    runs-on: ubuntu-latest
    env:
      ORCHESTRATION_DATABASE_URL: ${{ secrets.ORCHESTRATION_DATABASE_URL }}
      MEDIAPULSE_DATABASE_URL: ${{ secrets.MEDIAPULSE_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wait for orchestration DB
        run: |
          for i in {1..24}; do
            pnpm --filter=@hermes/orchestration-database exec prisma db execute --stdin <<< "SELECT 1;" && exit 0
            echo "Waiting for orchestration DB ($i/24)..."
            sleep 5
          done
          echo "Orchestration DB did not become ready in time"
          exit 1

      - name: Wait for mediapulse DB
        run: |
          for i in {1..24}; do
            pnpm --filter=@mediapulse/database exec prisma db execute --stdin <<< "SELECT 1;" && exit 0
            echo "Waiting for mediapulse DB ($i/24)..."
            sleep 5
          done
          echo "Mediapulse DB did not become ready in time"
          exit 1

  db-migrate:
    name: Apply Prisma migrations (production DBs)
    runs-on: ubuntu-latest
    needs: db-ready
    concurrency:
      group: prisma-migrate-production
      cancel-in-progress: false
    env:
      ORCHESTRATION_DATABASE_URL: ${{ secrets.ORCHESTRATION_DATABASE_URL }}
      MEDIAPULSE_DATABASE_URL: ${{ secrets.MEDIAPULSE_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migrate deploy (orchestration)
        run: pnpm --filter=@hermes/orchestration-database run db:migrate:deploy

      - name: Migrate deploy (mediapulse)
        run: pnpm --filter=@mediapulse/database run db:migrate:deploy

  agent-auth-api:
    runs-on: ubuntu-latest
    needs: db-migrate
    steps:
      - uses: actions/checkout@v6

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to fly.io
        run: flyctl deploy --remote-only --depot=false --ha=false -c apps/hermes/agent-auth-api/fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  agent-data-api:
    runs-on: ubuntu-latest
    needs: db-migrate
    steps:
      - uses: actions/checkout@v6

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to fly.io
        run: flyctl deploy --remote-only --depot=false --ha=false -c apps/mediapulse/agent-data-api/fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  domain-api:
    runs-on: ubuntu-latest
    needs: db-migrate
    steps:
      - uses: actions/checkout@v6

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to fly.io
        run: flyctl deploy --remote-only --depot=false --ha=false -c apps/mediapulse/domain-api/fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  agent-registry-api:
    runs-on: ubuntu-latest
    needs: db-migrate
    steps:
      - uses: actions/checkout@v6

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to fly.io
        run: flyctl deploy --remote-only --depot=false --ha=false -c apps/hermes/agent-registry-api/fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  user-registration:
    runs-on: ubuntu-latest
    needs: db-migrate
    steps:
      - uses: actions/checkout@v6

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to fly.io
        run: flyctl deploy --remote-only --depot=false --ha=false -c apps/mediapulse/user-registration/fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  hermes:
    runs-on: ubuntu-latest
    needs: db-migrate
    steps:
      - uses: actions/checkout@v6

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to fly.io
        run: flyctl deploy --remote-only --depot=false --ha=false -c apps/hermes/dashboard/fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  hermes-worker:
    runs-on: ubuntu-latest
    needs: db-migrate
    steps:
      - uses: actions/checkout@v6

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to fly.io
        run: flyctl deploy --remote-only --depot=false --ha=false -c apps/hermes/worker/fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
