name: Database Migrations

on:
  push:
    branches:
      - main
    paths:
      - packages/mediapulse/database/**
      - packages/hermes/orchestration-database/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # App Deployment and Agent Deployment each migrate before they publish, and all three migrate jobs
  # take the same `prisma-migrate-production` group. GitHub keeps one job running and at most one
  # queued per group, then cancels the older queued job when a third arrives. A commit touching both
  # a database package and a service therefore lost a whole workflow: on 327120df the cancelled job
  # was App Deployment's migrate step, and the seven app deploys behind it were skipped silently.
  #
  # Standing down when a deploy workflow will migrate keeps the contenders at two, which queue
  # safely. Ordering is unchanged, because a deploy workflow already migrates before it ships.
  #
  # Today every push that reaches this workflow stands down: a change under either database package
  # marks all services changed, so a deploy workflow always migrates and the push path here is a
  # guard rather than a route. It earns its keep if that mapping ever narrows, and it is what makes
  # dropping the push trigger the wrong simplification: that version would migrate nothing, quietly.
  changes:
    name: Detect whether a deploy workflow will migrate
    runs-on: ubuntu-latest
    outputs:
      deploy_migrates: ${{ steps.detect.outputs.deploy_migrates }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Detect whether a deploy workflow will migrate
        id: detect
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: bash .github/scripts/detect-deploy-migrates.sh

  db-migrate:
    name: Apply production database migrations
    runs-on: ubuntu-latest
    needs: changes
    # A manual run always migrates: dispatching this workflow is the operator asking for it.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.deploy_migrates != 'true'
    concurrency:
      group: prisma-migrate-production
      cancel-in-progress: false
    env:
      ORCHESTRATION_DATABASE_URL: ${{ secrets.ORCHESTRATION_DATABASE_URL }}
      MEDIAPULSE_DATABASE_URL: ${{ secrets.MEDIAPULSE_DATABASE_URL }}
      PG_DATAQUEUE_DATABASE: ${{ secrets.PG_DATAQUEUE_DATABASE }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply production database migrations
        run: bash .github/scripts/run-production-migrations.sh
