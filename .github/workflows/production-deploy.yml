name: Production Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_all:
        description: Rebuild and redeploy every service, not only the changed ones.
        type: boolean
        default: false
      services:
        description: Comma-separated services to rebuild and redeploy (e.g. "hermes,domain-api"). Overrides change detection.
        type: string
        default: ""

permissions:
  contents: read
  packages: write
  actions: read

# One deploy at a time. A newer push can replace a run that is still queued; nothing is lost,
# because every run diffs against the last successful deploy (see resolve-deploy-base.sh).
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      any: ${{ steps.detect.outputs.any }}
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Resolve the deploy base
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
          EVENT_BEFORE: ${{ github.event.before }}
          DEPLOY_ALL: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_all }}
        run: bash .github/scripts/resolve-deploy-base.sh

      - name: Detect which services changed
        id: detect
        env:
          WORKFLOW: all
          BASE_SHA: ${{ steps.base.outputs.base_sha }}
          HEAD_SHA: ${{ github.sha }}
          ONLY_SERVICES: ${{ github.event_name == 'workflow_dispatch' && inputs.services || '' }}
        run: bash .github/scripts/detect-changed-services.sh

  db-migrate:
    name: Apply Prisma migrations (production DBs)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.any == 'true'
    concurrency:
      group: prisma-migrate-production
      cancel-in-progress: false
    env:
      ORCHESTRATION_DATABASE_URL: ${{ secrets.ORCHESTRATION_DATABASE_URL }}
      MEDIAPULSE_DATABASE_URL: ${{ secrets.MEDIAPULSE_DATABASE_URL }}
      PG_DATAQUEUE_DATABASE: ${{ secrets.PG_DATAQUEUE_DATABASE }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply production database migrations
        run: bash .github/scripts/run-production-migrations.sh

  publish:
    name: Publish ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [changes, db-migrate]
    if: needs.changes.outputs.any == 'true'
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJson(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: |
            NEXT_PUBLIC_REGISTRATION_EMAIL=${{ matrix.service == 'user-registration' && (secrets.NEXT_PUBLIC_REGISTRATION_EMAIL || 'registration@example.com') || '' }}
            AGENT_DATA_API_URL=${{ matrix.service == 'user-registration' && (secrets.AGENT_DATA_API_URL || 'http://127.0.0.1:8081') || '' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:sha-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [changes, publish]
    if: needs.changes.outputs.any == 'true'
    timeout-minutes: 20
    # Each service's webhook URL is read from the env var its matrix entry names in `webhook_env`.
    # A new service needs an entry here as well as in scripts/lib/detect-pr-changes.mjs.
    env:
      DEPLOY_WEBHOOK_APP_AGENT_AUTH_API: ${{ secrets.COOLIFY_WEBHOOK_APP_AGENT_AUTH_API }}
      DEPLOY_WEBHOOK_APP_AGENT_DATA_API: ${{ secrets.COOLIFY_WEBHOOK_APP_AGENT_DATA_API }}
      DEPLOY_WEBHOOK_APP_AGENT_REGISTRY_API: ${{ secrets.COOLIFY_WEBHOOK_APP_AGENT_REGISTRY_API }}
      DEPLOY_WEBHOOK_APP_DOMAIN_API: ${{ secrets.COOLIFY_WEBHOOK_APP_DOMAIN_API }}
      DEPLOY_WEBHOOK_APP_HERMES: ${{ secrets.COOLIFY_WEBHOOK_APP_HERMES }}
      DEPLOY_WEBHOOK_APP_HERMES_WORKER: ${{ secrets.COOLIFY_WEBHOOK_APP_HERMES_WORKER }}
      DEPLOY_WEBHOOK_APP_USER_REGISTRATION: ${{ secrets.COOLIFY_WEBHOOK_APP_USER_REGISTRATION }}
      DEPLOY_WEBHOOK_AGENT_ARTICLE_ANALYSIS: ${{ secrets.COOLIFY_WEBHOOK_AGENT_ARTICLE_ANALYSIS }}
      DEPLOY_WEBHOOK_AGENT_CONTENT_GENERATION: ${{ secrets.COOLIFY_WEBHOOK_AGENT_CONTENT_GENERATION }}
      DEPLOY_WEBHOOK_AGENT_DATA_COLLECTION: ${{ secrets.COOLIFY_WEBHOOK_AGENT_DATA_COLLECTION }}
      DEPLOY_WEBHOOK_AGENT_DELIVERY: ${{ secrets.COOLIFY_WEBHOOK_AGENT_DELIVERY }}
      DEPLOY_WEBHOOK_AGENT_KNOWLEDGE_INGESTION: ${{ secrets.COOLIFY_WEBHOOK_AGENT_KNOWLEDGE_INGESTION }}
      DEPLOY_WEBHOOK_AGENT_NEWSLETTER_FEEDBACK: ${{ secrets.COOLIFY_WEBHOOK_AGENT_NEWSLETTER_FEEDBACK }}
      DEPLOY_WEBHOOK_AGENT_PAGE_COLLECTION: ${{ secrets.COOLIFY_WEBHOOK_AGENT_PAGE_COLLECTION }}
      DEPLOY_WEBHOOK_AGENT_QUERY_ANALYSIS: ${{ secrets.COOLIFY_WEBHOOK_AGENT_QUERY_ANALYSIS }}
      DEPLOY_WEBHOOK_AGENT_TICKER_ECHO: ${{ secrets.COOLIFY_WEBHOOK_AGENT_TICKER_ECHO }}
      DEPLOY_WEBHOOK_AGENT_USER_REGISTRATION: ${{ secrets.COOLIFY_WEBHOOK_AGENT_USER_REGISTRATION }}
    steps:
      - uses: actions/checkout@v6

      - name: Trigger deploy webhooks over one VPN session
        uses: ./.github/actions/remote-deploy
        with:
          services-json: ${{ needs.changes.outputs.matrix }}
          webhook-token: ${{ secrets.COOLIFY_WEBHOOK_SECRET }}
          vpn-config-b64: ${{ secrets.OPENVPN_CONFIG_B64 }}
          vpn-password: ${{ secrets.OPENVPN_PASSWORD }}

  prune:
    name: Prune old images for ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [changes, deploy]
    if: needs.changes.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.changes.outputs.matrix) }}
    steps:
      - name: Prune old GHCR versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ matrix.image }}
          package-type: container
          min-versions-to-keep: 5
          token: ${{ secrets.GITHUB_TOKEN }}
