name: Agent Deployment

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  db-ready:
    runs-on: ubuntu-latest
    env:
      ORCHESTRATION_DATABASE_URL: ${{ secrets.ORCHESTRATION_DATABASE_URL }}
      MEDIAPULSE_DATABASE_URL: ${{ secrets.MEDIAPULSE_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wait for orchestration DB
        run: |
          for i in {1..24}; do
            pnpm --filter=@hermes/orchestration-database exec prisma db execute --stdin <<< "SELECT 1;" && exit 0
            echo "Waiting for orchestration DB ($i/24)..."
            sleep 5
          done
          echo "Orchestration DB did not become ready in time"
          exit 1

      - name: Wait for mediapulse DB
        run: |
          for i in {1..24}; do
            pnpm --filter=@mediapulse/database exec prisma db execute --stdin <<< "SELECT 1;" && exit 0
            echo "Waiting for mediapulse DB ($i/24)..."
            sleep 5
          done
          echo "Mediapulse DB did not become ready in time"
          exit 1

  db-migrate:
    name: Apply Prisma migrations (production DBs)
    runs-on: ubuntu-latest
    needs: db-ready
    concurrency:
      group: prisma-migrate-production
      cancel-in-progress: false
    env:
      ORCHESTRATION_DATABASE_URL: ${{ secrets.ORCHESTRATION_DATABASE_URL }}
      MEDIAPULSE_DATABASE_URL: ${{ secrets.MEDIAPULSE_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migrate deploy (orchestration)
        run: pnpm --filter=@hermes/orchestration-database run db:migrate:deploy

      - name: Migrate deploy (mediapulse)
        run: pnpm --filter=@mediapulse/database run db:migrate:deploy

  publish:
    name: Publish ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: db-migrate
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: data-collection
            dockerfile: apps/mediapulse/agents/data-collection/Dockerfile
            image: data-collection
          - service: content-generation
            dockerfile: apps/mediapulse/agents/content-generation/Dockerfile
            image: content-generation
          - service: article-analysis
            dockerfile: apps/mediapulse/agents/article-analysis/Dockerfile
            image: article-analysis
          - service: query-analysis
            dockerfile: apps/mediapulse/agents/query-analysis/Dockerfile
            image: query-analysis
          - service: delivery
            dockerfile: apps/mediapulse/agents/delivery/Dockerfile
            image: delivery
          - service: ticker-echo
            dockerfile: apps/mediapulse/agents/ticker-echo/Dockerfile
            image: ticker-echo
          - service: agent-user-registration
            dockerfile: apps/mediapulse/agents/user-registration/Dockerfile
            image: agent-user-registration
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:sha-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy ${{ matrix.service }} via Coolify
    runs-on: ubuntu-latest
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: data-collection
            webhook_secret: COOLIFY_WEBHOOK_AGENT_DATA_COLLECTION
          - service: content-generation
            webhook_secret: COOLIFY_WEBHOOK_AGENT_CONTENT_GENERATION
          - service: article-analysis
            webhook_secret: COOLIFY_WEBHOOK_AGENT_ARTICLE_ANALYSIS
          - service: query-analysis
            webhook_secret: COOLIFY_WEBHOOK_AGENT_QUERY_ANALYSIS
          - service: delivery
            webhook_secret: COOLIFY_WEBHOOK_AGENT_DELIVERY
          - service: ticker-echo
            webhook_secret: COOLIFY_WEBHOOK_AGENT_TICKER_ECHO
          - service: agent-user-registration
            webhook_secret: COOLIFY_WEBHOOK_AGENT_USER_REGISTRATION
    steps:
      - name: Trigger Coolify deployment
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets[matrix.webhook_secret] }}
        run: curl --fail --silent --show-error -X GET "$COOLIFY_WEBHOOK_URL"

  cleanup:
    name: Prune old GHCR versions (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - data-collection
          - content-generation
          - article-analysis
          - query-analysis
          - delivery
          - ticker-echo
          - agent-user-registration
    steps:
      - uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ matrix.image }}
          package-type: container
          min-versions-to-keep: 2
          token: ${{ secrets.GITHUB_TOKEN }}
