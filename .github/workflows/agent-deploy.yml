name: Agent Deployment

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  db-ready:
    runs-on: ubuntu-latest
    env:
      ORCHESTRATION_DATABASE_URL: ${{ secrets.ORCHESTRATION_DATABASE_URL }}
      MEDIAPULSE_DATABASE_URL: ${{ secrets.MEDIAPULSE_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wait for orchestration DB
        run: |
          for i in {1..24}; do
            pnpm --filter=@hermes/orchestration-database exec prisma db execute --stdin <<< "SELECT 1;" && exit 0
            echo "Waiting for orchestration DB ($i/24)..."
            sleep 5
          done
          echo "Orchestration DB did not become ready in time"
          exit 1

      - name: Wait for mediapulse DB
        run: |
          for i in {1..24}; do
            pnpm --filter=@mediapulse/database exec prisma db execute --stdin <<< "SELECT 1;" && exit 0
            echo "Waiting for mediapulse DB ($i/24)..."
            sleep 5
          done
          echo "Mediapulse DB did not become ready in time"
          exit 1

  db-migrate:
    name: Apply Prisma migrations (production DBs)
    runs-on: ubuntu-latest
    needs: db-ready
    concurrency:
      group: prisma-migrate-production
      cancel-in-progress: false
    env:
      ORCHESTRATION_DATABASE_URL: ${{ secrets.ORCHESTRATION_DATABASE_URL }}
      MEDIAPULSE_DATABASE_URL: ${{ secrets.MEDIAPULSE_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migrate deploy (orchestration)
        run: pnpm --filter=@hermes/orchestration-database run db:migrate:deploy

      - name: Migrate deploy (mediapulse)
        run: pnpm --filter=@mediapulse/database run db:migrate:deploy

  publish:
    name: Publish ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: db-migrate
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: delivery
            dockerfile: apps/mediapulse/agents/delivery/Dockerfile
            image: agent-delivery
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:sha-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy ${{ matrix.service }} via Coolify
    runs-on: ubuntu-latest
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: delivery
            webhook_secret: COOLIFY_WEBHOOK_AGENT_DELIVERY
    steps:
      - name: Trigger Coolify deployment over OpenVPN
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets[matrix.webhook_secret] }}
          OPENVPN_CONFIG_B64: ${{ secrets.OPENVPN_CONFIG_B64 }}
          OPENVPN_PASSWORD: ${{ secrets.OPENVPN_PASSWORD }}
        run: |
          set -euo pipefail

          if ! command -v openvpn >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y openvpn
          fi

          WORKDIR="$(mktemp -d)"
          cleanup() {
            if [ -f "$WORKDIR/openvpn.pid" ]; then
              sudo kill "$(sudo cat "$WORKDIR/openvpn.pid")" >/dev/null 2>&1 || true
            fi
            rm -rf "$WORKDIR"
          }
          trap cleanup EXIT

          printf "%s" "$OPENVPN_CONFIG_B64" | base64 --decode > "$WORKDIR/client.ovpn"
          printf "openvpn\n%s\n" "$OPENVPN_PASSWORD" > "$WORKDIR/auth.txt"
          chmod 600 "$WORKDIR/auth.txt"

          sudo openvpn \
            --config "$WORKDIR/client.ovpn" \
            --auth-user-pass "$WORKDIR/auth.txt" \
            --daemon \
            --writepid "$WORKDIR/openvpn.pid" \
            --log "$WORKDIR/openvpn.log"

          connected="false"
          for _ in {1..30}; do
            if sudo grep -q "Initialization Sequence Completed" "$WORKDIR/openvpn.log"; then
              connected="true"
              break
            fi
            if [ -f "$WORKDIR/openvpn.pid" ] && ! sudo kill -0 "$(sudo cat "$WORKDIR/openvpn.pid")" >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done

          if [ "$connected" != "true" ]; then
            sudo cat "$WORKDIR/openvpn.log" || true
            exit 1
          fi

          curl --fail --silent --show-error --retry 3 --retry-delay 3 -X GET "$COOLIFY_WEBHOOK_URL"

  cleanup:
    name: Prune old GHCR versions (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - agent-delivery
    steps:
      - uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ matrix.image }}
          package-type: container
          min-versions-to-keep: 2
          token: ${{ secrets.GITHUB_TOKEN }}
