name: Agent Deployment

# Requires GitHub secret: FLY_API_TOKEN. Agents use agent-data-api for data; no database access.
on:
  push:
    branches:
      - main

jobs:
  data-collection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Set up build environment
        run: |
          ./dev-bootstrap.sh
          pnpm install
          pnpm generate

      - name: Build
        run: pnpm build --filter=@mediapulse/data-collection

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to fly.io
        run: flyctl deploy --remote-only -c apps/mediapulse/agents/data-collection/fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  content-generation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Set up build environment
        run: |
          ./dev-bootstrap.sh
          pnpm install
          pnpm generate

      - name: Build
        run: pnpm build --filter=@mediapulse/content-generation

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to fly.io
        run: flyctl deploy --remote-only -c apps/mediapulse/agents/content-generation/fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  delivery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Set up build environment
        run: |
          ./dev-bootstrap.sh
          pnpm install
          pnpm generate

      - name: Build
        run: pnpm build --filter=@mediapulse/delivery

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to fly.io
        run: flyctl deploy --remote-only -c apps/mediapulse/agents/delivery/fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
