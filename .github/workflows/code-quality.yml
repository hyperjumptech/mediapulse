name: Code Quality Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build everything
    runs-on: ubuntu-latest

    services:
      # Label used to access the service container
      postgres:
        # Docker Hub image
        image: postgres
        # Provide the password for postgres
        env:
          POSTGRES_USER: mediapulse
          POSTGRES_PASSWORD: mediapulse
          POSTGRES_DB: mediapulse
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          # Maps tcp port 5432 on service container to the host
          - 5432:5432

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Set up local environment
        env:
          # Required by dev-setup-local.sh --non-interactive (create:admin + domain seed); CI-only placeholders.
          DEV_SETUP_ADMIN_EMAIL: ci-setup@example.invalid
          DEV_SETUP_ADMIN_PASSWORD: CiLocalDevSetup2024
        run: |
          ./dev-setup-local.sh --non-interactive \
            --admin-email "$DEV_SETUP_ADMIN_EMAIL" \
            --admin-password "$DEV_SETUP_ADMIN_PASSWORD"

      - name: Generate route actions
        run: pnpm generate

      - name: Build
        run: pnpm build

  code-quality:
    runs-on: ubuntu-latest
    name: Code quality check

    services:
      # Label used to access the service container
      postgres:
        # Docker Hub image
        image: postgres
        # Provide the password for postgres
        env:
          POSTGRES_USER: mediapulse
          POSTGRES_PASSWORD: mediapulse
          POSTGRES_DB: mediapulse
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          # Maps tcp port 5432 on service container to the host
          - 5432:5432

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Set up local environment
        env:
          # Required by dev-setup-local.sh --non-interactive (create:admin + domain seed); CI-only placeholders.
          DEV_SETUP_ADMIN_EMAIL: ci-setup@example.invalid
          DEV_SETUP_ADMIN_PASSWORD: CiLocalDevSetup2024
        run: |
          ./dev-setup-local.sh --non-interactive \
            --admin-email "$DEV_SETUP_ADMIN_EMAIL" \
            --admin-password "$DEV_SETUP_ADMIN_PASSWORD"

      - name: Code quality
        run: pnpm code-quality
