name: Code Quality Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

jobs:
  changes:
    name: Determine whether heavy jobs should run
    runs-on: ubuntu-latest
    outputs:
      run_heavy_jobs: ${{ steps.determine.outputs.run_heavy_jobs }}
      turbo_scope: ${{ steps.determine.outputs.turbo_scope }}
      turbo_base_sha: ${{ steps.determine.outputs.turbo_base_sha }}
      turbo_head_sha: ${{ steps.determine.outputs.turbo_head_sha }}
      run_prisma_drift: ${{ steps.determine.outputs.run_prisma_drift }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Detect PR change scope
        id: determine
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/detect-pr-changes.mjs --event "$EVENT_NAME" --base "$PR_BASE_SHA" --head "$PR_HEAD_SHA"

  code-quality-light:
    runs-on: ubuntu-latest
    name: Code quality check (CI infra)
    needs: changes
    if: needs.changes.outputs.run_heavy_jobs == 'true' && needs.changes.outputs.turbo_scope == 'ci_infra'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-monorepo

      - name: Code quality
        run: |
          set -eu
          pnpm --filter @workspace/cursor-pr-review-tests test
          pnpm run format:check:changed -- \
            --base "${{ needs.changes.outputs.turbo_base_sha }}" \
            --head "${{ needs.changes.outputs.turbo_head_sha }}"

  code-quality-heavy:
    runs-on: ubuntu-latest
    name: Code quality check
    needs: changes
    if: needs.changes.outputs.run_heavy_jobs == 'true' && needs.changes.outputs.turbo_scope != 'ci_infra'
    env:
      MEDIAPULSE_DATABASE_URL: postgresql://mediapulse:mediapulse@localhost:5432/mediapulse?schema=mediapulse
      ORCHESTRATION_DATABASE_URL: postgresql://mediapulse:mediapulse@localhost:5432/mediapulse?schema=orchestration
      MEDIAPULSE_API_URL: http://localhost:8090
      HERMES_API_URL: http://localhost:3001
      DOMAIN_INTEGRATION_API_KEY: ci-domain-integration-key
      DOMAIN_INTEGRATION_ID: local-domain
      AGENT_AUTH_API_URL: http://localhost:8080
      UNSUBSCRIBE_SECRET: ci-unsubscribe-secret
      AGENT_DATA_API_URL: http://localhost:8081
      MEDIAPULSE_CGA_DIAGNOSTICS_ENABLED: "false"

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: mediapulse
          POSTGRES_PASSWORD: mediapulse
          POSTGRES_DB: mediapulse
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-monorepo

      - name: Check Prisma schema drift
        if: needs.changes.outputs.run_prisma_drift == 'true'
        run: bash .github/scripts/check-prisma-schema-drift.sh

      - name: Generate route actions
        env:
          TURBO_SCM_BASE: ${{ needs.changes.outputs.turbo_base_sha }}
        run: |
          set -eu
          if [ "${{ needs.changes.outputs.turbo_scope }}" = "affected" ]; then
            pnpm exec turbo run generate --affected
          else
            pnpm generate
          fi

      - name: Code quality
        env:
          TURBO_SCM_BASE: ${{ needs.changes.outputs.turbo_base_sha }}
        run: |
          set -eu
          if [ "${{ needs.changes.outputs.turbo_scope }}" = "affected" ]; then
            pnpm exec turbo run build lint type:check test:coverage --affected
            pnpm run merge-workspace-coverage
            pnpm run format:check:changed -- \
              --base "${{ needs.changes.outputs.turbo_base_sha }}" \
              --head "${{ needs.changes.outputs.turbo_head_sha }}"
          else
            pnpm exec turbo run build lint type:check test:coverage
            pnpm run merge-workspace-coverage
            pnpm run format:check
          fi
