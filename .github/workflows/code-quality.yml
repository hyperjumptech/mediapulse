name: Code Quality Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

jobs:
  changes:
    name: Determine whether heavy jobs should run
    runs-on: ubuntu-latest
    outputs:
      run_heavy_jobs: ${{ steps.determine.outputs.run_heavy_jobs }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine whether changes are docs-only
        id: determine
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -eu

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run_heavy_jobs=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_sha="$PR_BASE_SHA"
            head_sha="$PR_HEAD_SHA"
          else
            base_sha="$PUSH_BEFORE_SHA"
            head_sha="$PUSH_HEAD_SHA"
          fi

          if [ -z "$base_sha" ] || [ "$base_sha" = "0000000000000000000000000000000000000000" ]; then
            base_sha="$(git rev-parse "${head_sha}^" 2>/dev/null || true)"
          fi

          if [ -z "$base_sha" ] || [ -z "$head_sha" ]; then
            echo "run_heavy_jobs=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --name-only "$base_sha" "$head_sha")"

          if [ -z "$changed_files" ]; then
            echo "run_heavy_jobs=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          run_heavy_jobs="false"
          while IFS= read -r file_path; do
            [ -z "$file_path" ] && continue
            case "$file_path" in
              dev-docs/*|*.md|*.mdx|.github/*.md|.github/**/*.md|.cursor/*|.cursor/**|scripts/*|scripts/**|turbo.json|turbo/*|turbo/**)
                ;;
              *)
                run_heavy_jobs="true"
                break
                ;;
            esac
          done <<< "$changed_files"

          echo "run_heavy_jobs=$run_heavy_jobs" >> "$GITHUB_OUTPUT"

  build:
    name: Build everything
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_heavy_jobs == 'true'

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: mediapulse
          POSTGRES_PASSWORD: mediapulse
          POSTGRES_DB: mediapulse
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v6

      - name: Turbo local cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - uses: oven-sh/setup-bun@v2

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Set up local environment
        env:
          DEV_SETUP_ADMIN_EMAIL: ci-setup@example.invalid
          DEV_SETUP_ADMIN_PASSWORD: CiLocalDevSetup2024
        run: |
          ./dev-setup-local.sh --non-interactive \
            --admin-email "$DEV_SETUP_ADMIN_EMAIL" \
            --admin-password "$DEV_SETUP_ADMIN_PASSWORD"

      - name: Generate route actions
        run: pnpm generate

      - name: Build
        run: pnpm build

  code-quality:
    runs-on: ubuntu-latest
    name: Code quality check
    needs: [changes, build]
    if: needs.changes.outputs.run_heavy_jobs == 'true'

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: mediapulse
          POSTGRES_PASSWORD: mediapulse
          POSTGRES_DB: mediapulse
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v6

      - name: Turbo local cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - uses: oven-sh/setup-bun@v2

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Set up local environment
        env:
          DEV_SETUP_ADMIN_EMAIL: ci-setup@example.invalid
          DEV_SETUP_ADMIN_PASSWORD: CiLocalDevSetup2024
        run: |
          ./dev-setup-local.sh --non-interactive \
            --admin-email "$DEV_SETUP_ADMIN_EMAIL" \
            --admin-password "$DEV_SETUP_ADMIN_PASSWORD"

      - name: Code quality
        run: pnpm code-quality
