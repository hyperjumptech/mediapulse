# fly.toml app configuration file generated for mediapulse-domain-api on 2026-03-27T15:52:34+07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'mediapulse-domain-api'
primary_region = 'sin'
# One Machine per deploy: use `fly deploy --ha=false` (GitHub Actions passes it). Otherwise Fly may seed two Machines for HA.

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8090
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[http_service.checks]]
  grace_period = "60s"
  interval = "30s"
  method = "GET"
  timeout = "10s"
  path = "/v1/health"
  protocol = "http"

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
